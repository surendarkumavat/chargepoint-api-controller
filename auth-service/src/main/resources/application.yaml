ktor:
  application:
    modules:
      - com.suri.chargepoint.ApplicationKt.module
  deployment:
    port: 8081

app:
  auth-service:
    http-client:
      max-connections-count: 1000
      max-connections-per-route: 100
      request-timeout: 5000
      connect-timeout: 5000
      socket-timeout: 5000
      keep-alive-time: 5000
      connect-attempts: 5